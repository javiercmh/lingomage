name: Validate subapp
on:
  push:
  pull_request:
jobs:
  checks:
    # Keep testing the minimum supported Python on an image that provides it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check.py
