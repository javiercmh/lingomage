activity = "1.10.1"
lifecycle = "2.9.2"
browser = "1.9.0"
coroutines = "1.10.2"
okhttp = "4.12.0"
gson = "2.13.1"
nimbus = "10.4.2"
room = "2.8.4"
datastore = "1.1.7"
